# Trigger authoritative verification for latest main commit
# Single authoritative Phase 2 workflow
# Verification trigger: rerun after predictive-brain changes.
name: Phase 2 authoritative OOS

on:
  push:
    paths:
      - "scripts/phase2_authoritative.py"
      - "app/ml/**"
      - "requirements.txt"
      - ".github/workflows/phase2-authoritative-current.yml"
  workflow_dispatch:

concurrency:
  group: phase2-authoritative-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PHASE2_OOS_START: "2026-07-01T00:00:00+00:00"
      PHASE2_OOS_END: "2026-09-21T00:00:00+00:00"
      PHASE2_VERSION: "phase2-authoritative-current"
      HHHAI_BRAIN_BOOTSTRAP_SYMBOLS: "BTCUSDT"
      HHHAI_BRAIN_BOOTSTRAP_CANDLES: "30000"
      HHHAI_BRAIN_BOOTSTRAP_INTERVAL: "1h"
      HHHAI_BRAIN_LABEL_THRESHOLD: ""
      HHHAI_PHASE2_TRAIN_FILTER_MULTIPLIER: "1.0"
      HHHAI_PHASE2_FIXED_LABEL_THRESHOLD: ""
      HHHAI_PHASE2_LABEL_MODE: "fixed"
      HHHAI_PHASE2_FIXED_HORIZON: ""
      HHHAI_PHASE2_SIDE_SIGNAL_FLOOR: "0.35"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run authoritative Phase 2
        run: python scripts/phase2_authoritative.py
      - name: Upload Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-authoritative-evidence
          path: |
            phase2_report.json
            artifacts/predictive_brain.joblib
            artifacts/predictive_brain_manifest.json
      - name: Mark Phase 2 complete
        if: success()
        env:
          PHASE2_REPORT_PATH: phase2_report.json
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/mark_phase2_complete.py
      - name: Preserve promoted artifact and roadmap evidence
        if: success()
        run: |
          git config user.name "HHHAI Phase 2"
          git config user.email "actions@github.com"
          git add phase2_report.json artifacts/predictive_brain.joblib artifacts/predictive_brain_manifest.json REAL_MONEY_READINESS_ROADMAP.md
          git diff --cached --quiet || git commit -m "[phase2] Preserve authoritative promoted artifact"
          git push
