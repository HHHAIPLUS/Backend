name: Phase 2 Predictive Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_phase2_predictive.py tests/test_stage3_ensemble.py tests/test_stage3_validation.py
      - run: python scripts/phase2_oos_validation.py
