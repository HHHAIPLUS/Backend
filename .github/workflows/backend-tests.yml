name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run tests
        env:
          HHHAI_AUTOTRADING_ENABLED: 'true'
          LIVE_TRADING_ENABLED: 'false'
        run: pytest -q

  deployed-smoke:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed root and Stage 7 research status endpoint
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..24}; do
            if curl --fail --silent --show-error --max-time 15 https://hhhai.onrender.com/ > /tmp/root.json && \
               curl --fail --silent --show-error --max-time 15 https://hhhai.onrender.com/api/research/status > /tmp/stage7.json; then
              python - <<'PY'
          import json
          root=json.load(open('/tmp/root.json'))
          status=json.load(open('/tmp/stage7.json'))
          assert root['phase'].startswith('Stage 7'), root
          assert status['engine'] == 'stage7-research-loop-v1', status
          assert status['production_self_modification'] is False
          assert status['execution_authority'] is False
          assert isinstance(status['snapshots'], int)
          assert isinstance(status['candidates'], int)
          print('deployed Stage 7 smoke: PASS')
          PY
              exit 0
            fi
            sleep 5
          done
          echo 'deployed Stage 7 smoke: FAILED'
          exit 1
