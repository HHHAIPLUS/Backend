name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run tests
        env:
          HHHAI_AUTOTRADING_ENABLED: 'true'
          LIVE_TRADING_ENABLED: 'false'
        run: pytest -q

  deployed-smoke:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Stage 8 risk and capital safety
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl --fail --silent --show-error --max-time 15 https://hhhai.onrender.com/ > /tmp/root.json && \
               curl --fail --silent --show-error --max-time 15 https://hhhai.onrender.com/api/risk/status > /tmp/risk.json && \
               curl --fail --silent --show-error --max-time 15 https://hhhai.onrender.com/api/research/status > /tmp/stage7.json; then
              python - <<'PY'
          import json
          root=json.load(open('/tmp/root.json'))
          risk=json.load(open('/tmp/risk.json'))
          stage7=json.load(open('/tmp/stage7.json'))
          assert root['phase'].startswith('Stage 8'), root
          assert root['risk_engine'] == 'independent', root
          assert root['live_trading_enabled'] is False, root
          assert root['execution_authority'] is False, root
          assert risk['execution_authority'] is False, risk
          assert risk['kills']['global']['enabled'] is False, risk
          assert stage7['production_self_modification'] is False, stage7
          assert stage7['execution_authority'] is False, stage7
          print('deployed Stage 8 risk smoke: PASS')
          PY
              exit 0
            fi
            sleep 5
          done
          echo 'deployed Stage 8 risk smoke: FAILED'
          exit 1
