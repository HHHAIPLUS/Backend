name: Phase 3 Robustness Implementation Gate

on:
  push:
    paths:
      - "ai/stress_harness.py"
      - "app/ml/phase3_robustness.py"
      - "tests/test_stress_harness.py"
      - "tests/test_phase3_robustness.py"
      - ".github/workflows/phase3-robustness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Phase 3 implementation tests
        run: pytest -q tests/test_stress_harness.py tests/test_phase3_robustness.py
      - name: Run syntax/import smoke test
        run: python -c "from ai.stress_harness import StressHarness, standard_scenarios; from app.ml.phase3_robustness import Phase3Robustness; assert not StressHarness().run('authority', lambda: {'execution_authority': False, 'live_exchange_order': False}).violations; assert Phase3Robustness().analyze([{ 'gross_return': 0.001, 'regime': 'sideways', 'volatility_bucket': 'low', 'liquidity_bucket': 'high'}] * 100)"
