name: Phase 2 Gate

permissions:
  contents: write

concurrency:
  group: phase2-gate
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_phase2_predictive.py tests/test_stage3_validation.py
      - run: PYTHONPATH=. PHASE2_CANDLES=30000 python scripts/phase2_oos_validation.py
      - name: Mark Phase 2 complete only after every fixed gate passes
        if: success()
        run: |
          python scripts/mark_phase2_complete.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REAL_MONEY_READINESS_ROADMAP.md
          git commit -m "[phase2] Mark Phase 2 complete after verified OOS promotion"
          git push
      - name: Upload Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-oos-evidence
          path: artifacts/phase2_oos_report.json
          if-no-files-found: warn
