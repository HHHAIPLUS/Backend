name: Phase 2 Gate

permissions:
  contents: write

concurrency:
  group: phase2-gate
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_phase2_predictive.py tests/test_stage3_validation.py
      - name: Run fixed Phase 2 OOS validation
        env:
          PHASE2_CANDLES: "10000"
          HHHAI_PHASE2_LABEL_MODE: "fixed"
          HHHAI_PHASE2_FIXED_HORIZON: "6"
          HHHAI_BRAIN_LABEL_THRESHOLD: "0.0015"
          PHASE2_OOS_START: "2026-07-01T00:00:00+00:00"
          PHASE2_OOS_END: "2026-09-21T00:00:00+00:00"
        run: PYTHONPATH=. python scripts/phase2_oos_validation.py
      - name: Mark Phase 2 complete only after every fixed gate passes
        if: success()
        run: |
          python scripts/mark_phase2_complete.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REAL_MONEY_READINESS_ROADMAP.md
          git commit -m "[phase2] Mark Phase 2 complete after verified OOS promotion"
          git push
      # Authoritative 30k-candle OOS gate; evidence is uploaded even on failure.
      - name: Upload Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-oos-evidence
          path: artifacts/phase2_oos_report.json
          if-no-files-found: warn
