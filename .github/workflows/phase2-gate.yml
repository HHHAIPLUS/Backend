name: Phase 2 Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_phase2_predictive.py tests/test_stage3_validation.py
      - run: PYTHONPATH=. PHASE2_CANDLES=30000 python scripts/phase2_oos_validation.py
      - name: Upload Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-oos-evidence
          path: artifacts/phase2_oos_report.json
          if-no-files-found: warn
