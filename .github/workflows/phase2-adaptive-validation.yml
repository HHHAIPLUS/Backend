name: Phase 2 adaptive validation
# Authoritative production-brain verification; triggered by main-branch changes.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase2_adaptive_validation.py'
      - 'scripts/phase2_end_to_end_check.py'
      - 'app/ml/features.py'
      - 'app/ml/predictive_brain.py'
      - 'app/ml/model_validation.py'
      - '.github/workflows/phase2-adaptive-validation.yml'
  workflow_dispatch:
env:
  # Frozen Phase 2 configuration (completion-gate evidence).
  # COST_RATE: Bitget USDT-M ~0.02% maker + 0.06% taker + modest slippage ≈ 0.08%.
  # Family/horizon/window frozen from pre-OOS validation research; untouched OOS is not retuned.
  PHASE2_PROVIDER: bitget
  PHASE2_SYMBOL: BTCUSDT
  PHASE2_INTERVAL: 1h
  PHASE2_CANDLES: "30000"
  PHASE2_OOS_START: "2026-07-01T00:00:00+00:00"
  PHASE2_OOS_END: "2026-09-21T00:00:00+00:00"
  HHHAI_PHASE2_COST_RATE: "0.0008"
  HHHAI_BRAIN_LABEL_THRESHOLD: "0.0010"
  HHHAI_PHASE2_SIDE_SIGNAL_FLOOR: "0.30"
  HHHAI_PHASE2_FIXED_HORIZON: "6"
  HHHAI_PHASE2_FIXED_MODEL_FAMILY: "trend_following"
  HHHAI_PHASE2_FIXED_TRAIN_WINDOW: "0"
  HHHAI_PHASE2_TREND_GAP_THRESHOLD: "0.001"
  HHHAI_PHASE2_TREND_MOM_THRESHOLD: "0.001"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Configure Python import path
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: End-to-end production brain diagnostic
        run: python scripts/phase2_end_to_end_check.py
      - name: Authoritative Phase 2 verification
        run: python scripts/phase2_adaptive_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-adaptive-evidence
          path: phase2_evidence/
          if-no-files-found: warn
