services:
  - type: web
    name: hhhai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: TESTNET_TRADING_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: HHHAI_CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HHHAI_ADMIN_TOKEN
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_TESTNET
        value: "false"
      - key: BITGET_API_KEY
        sync: false
      - key: BITGET_API_SECRET
        sync: false
      - key: BITGET_PASSPHRASE
        sync: false
      - key: BITGET_TESTNET
        value: "true"
      - key: HHHAI_AUTOTRADING_ENABLED
        value: "false"
      - key: HHHAI_TRADING_MODE
        value: "paper"
      - key: HHHAI_TRADE_SYMBOLS
        value: "BTCUSDT"
      - key: HHHAI_MAX_ACTIVE_SYMBOLS
        value: "5"
      - key: HHHAI_UNIVERSE_REFRESH_SECONDS
        value: "300"
      - key: HHHAI_EXECUTION_EXCHANGE
        value: "binance"
      - key: HHHAI_MARKET_EXCHANGE
        value: "binance"
      - key: HHHAI_TRADING_INTERVAL_SECONDS
        value: "30"
      - key: HHHAI_PAPER_EQUITY
        value: "10000"
      - key: HHHAI_MIN_TRADE_CONFIDENCE
        value: "0.60"
      - key: HHHAI_MAX_SPREAD_BPS
        value: "12"
      - key: HHHAI_RISK_PER_TRADE_PCT
        value: "0.5"
      - key: HHHAI_MIN_REWARD_RR
        value: "1.8"
      - key: HHHAI_POSITION_REVIEW_INTERVAL_SECONDS
        value: "5"
      - key: HHHAI_MAX_POSITION_REVIEWS_PER_CYCLE
        value: "20"
      - key: HHHAI_AUTO_BOOTSTRAP_BRAIN
        value: "false"
      - key: HHHAI_FORCE_BOOTSTRAP_BRAIN
        value: "false"
      - key: HHHAI_BRAIN_BOOTSTRAP_SYMBOLS
        value: "BTCUSDT"
      - key: HHHAI_BRAIN_BOOTSTRAP_CANDLES
        value: "30000"
      - key: HHHAI_BRAIN_BOOTSTRAP_INTERVAL
        value: "1h"

      # Phase 2 must use the same authoritative configuration as GitHub Actions.
      - key: PHASE2_PROVIDER
        value: "bitget"
      - key: PHASE2_SYMBOL
        value: "BTCUSDT"
      - key: PHASE2_INTERVAL
        value: "1h"
      - key: PHASE2_CANDLES
        value: "30000"
      - key: PHASE2_VERSION
        value: "phase2-authoritative-current"
      - key: PHASE2_OOS_START
        value: "2026-07-01T00:00:00+00:00"
      - key: PHASE2_OOS_END
        value: "2026-09-21T00:00:00+00:00"
      - key: HHHAI_BRAIN_LABEL_THRESHOLD
        value: "0.0015"
      - key: HHHAI_PHASE2_TRAIN_FILTER_MULTIPLIER
        value: "1.0"
      - key: HHHAI_PHASE2_LABEL_MODE
        value: "fixed"
      - key: HHHAI_PHASE2_FIXED_LABEL_THRESHOLD
        value: ""
      - key: HHHAI_PHASE2_FIXED_HORIZON
        value: ""
      - key: HHHAI_PHASE2_SIDE_SIGNAL_FLOOR
        value: "0.35"
