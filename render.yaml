services:
  - type: web
    name: hhhai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: TESTNET_TRADING_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HHHAI_ADMIN_TOKEN
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_TESTNET
        value: "true"
      - key: BITGET_API_KEY
        sync: false
      - key: BITGET_API_SECRET
        sync: false
      - key: BITGET_PASSPHRASE
        sync: false
      - key: BITGET_TESTNET
        value: "true"
      - key: HHHAI_AUTOTRADING_ENABLED
        value: "false"
      - key: HHHAI_TRADING_MODE
        value: "paper"
      - key: HHHAI_TRADE_SYMBOLS
        value: "BTCUSDT"
      - key: HHHAI_EXECUTION_EXCHANGE
        value: "binance"
      - key: HHHAI_MARKET_EXCHANGE
        value: "binance"
      - key: HHHAI_TRADING_INTERVAL_SECONDS
        value: "30"
      - key: HHHAI_PAPER_EQUITY
        value: "10000"
      - key: HHHAI_MIN_TRADE_CONFIDENCE
        value: "0.60"
      - key: HHHAI_MAX_SPREAD_BPS
        value: "12"
      - key: HHHAI_RISK_PER_TRADE_PCT
        value: "0.5"
      - key: HHHAI_MIN_REWARD_RR
        value: "1.8"
      - key: HHHAI_POSITION_REVIEW_INTERVAL_SECONDS
        value: "5"
      - key: HHHAI_MAX_POSITION_REVIEWS_PER_CYCLE
        value: "20"
